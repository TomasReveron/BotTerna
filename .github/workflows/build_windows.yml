name: Compilar y Publicar BotTerna para Windows (.exe)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Generar BotTerna.exe (Windows x64)
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🔨 Compilar archivo único BotTerna.exe
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python build.py

      - name: 🚀 Subir como artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: BotTerna-Windows-x64
          path: dist/BotTerna.exe
          if-no-files-found: error
          retention-days: 30

      - name: 🌟 Publicar directamente en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "BotTerna - Versión Oficial para Windows"
          body: |
            ## 🚀 BotTerna para Windows (64-bit)

            ### 📥 Instrucciones:
            1. Descarga el archivo **`BotTerna.exe`** adjunto abajo.
            2. Haz doble clic para abrir el programa (no necesitas tener Python instalado).
            3. Actívalo con tu clave asignada y configura tus materias.
          files: dist/BotTerna.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
