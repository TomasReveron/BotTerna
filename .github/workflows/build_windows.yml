name: Compilar BotTerna para Windows (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde GitHub

jobs:
  build-windows:
    name: Generar BotTerna.exe (Windows x64)
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🔨 Compilar archivo único BotTerna.exe
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python build.py

      - name: 🚀 Subir BotTerna.exe como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: BotTerna-Windows-x64
          path: dist/BotTerna.exe
          if-no-files-found: error
          retention-days: 30
